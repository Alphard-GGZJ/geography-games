<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主持人控制台 - 开字母猜城市 (计时版)</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: #1f2937; padding: 20px; line-height: 1.6;}
        .container { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
        .main-area { flex: 1; min-width: 0; }
        h1 { text-align: center; margin-bottom: 20px; color: var(--primary-color); }

        .panel { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; }
        
        textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; resize: vertical; min-height: 80px; font-family: monospace;}
        textarea:focus { border-color: var(--primary-color); }
        
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 13px; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-warning { background: var(--warning-color); color: white; }
        .btn-success { background: var(--success-color); color: white; }
        .btn-gray { background: #6b7280; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;}

        /* 题目列表样式 */
        .city-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 15px; 
            background: #111827; 
            color: #e5e7eb; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            font-family: 'Courier New', Consolas, monospace; 
            font-size: 20px; 
            gap: 15px;
        }
        .city-pinyin { flex: 1; letter-spacing: 2px; word-break: break-all; }
        .city-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        
        .highlight { color: var(--warning-color); font-weight: bold; }
        .revealed-text { color: var(--success-color); font-weight: bold; }
        .answer-text { color: var(--success-color); font-size: 14px; opacity: 0.8; margin-left: 10px; }
        .timer-badge { background: #374151; padding: 2px 10px; border-radius: 12px; font-size: 13px; color: #e5e7eb; }

        /* 字母键盘 */
        .keyboard { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; padding: 15px; background: #f9fafb; border-radius: 10px; }
        .key { 
            width: 42px; height: 42px; 
            display: flex; align-items: center; justify-content: center; 
            background: #e5e7eb; border-radius: 6px; 
            cursor: pointer; font-weight: bold; user-select: none; 
            transition: all 0.2s; font-size: 16px;
        }
        .key:hover { background: var(--primary-color); color: white; transform: translateY(-2px); }
        .key.active { background: var(--primary-color); color: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3); }

        /* 底部状态输出面板 */
        .output-panel {
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 18px;
            line-height: 2;
            white-space: pre-wrap;
            margin-top: 20px;
            position: relative;
        }
        .output-panel .highlight { color: var(--warning-color); font-weight: bold; }
        .copy-btn { 
            position: absolute; top: 15px; right: 15px; 
            background: #374151; color: #e5e7eb; border: none; 
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; 
        }
        .copy-btn:hover { background: #4b5563; }

        /* 右侧玩家面板 */
        .player-panel { width: 300px; flex-shrink: 0; }
        .player-input-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .player-input-row input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; }
        .player-input-row input:focus { border-color: var(--primary-color); }
        .player-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 10px; background: #f9fafb; border-radius: 8px; margin-bottom: 8px; 
        }
        .player-name { 
            font-weight: bold; cursor: pointer; padding: 4px 8px; border-radius: 4px; 
            min-width: 60px; border: 1px solid transparent; 
        }
        .player-name:hover { border-color: #d1d5db; background: white; }
        .player-score { font-size: 18px; font-weight: bold; color: var(--primary-color); margin: 0 10px; }
        .player-btns { display: flex; gap: 4px; }

        /* 计时器 */
        .timer-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .timer-display {
            font-size: 28px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: #1f2937;
            color: #fbbf24;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 2px;
        }
        .timer-controls {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧：主控制台 -->
    <div class="main-area">
        <h1>🎤 开字母猜城市 · 计分版（计时器）</h1>

        <!-- 0. 计时器 -->
        <div class="panel" style="padding: 12px 20px;">
            <div class="timer-bar">
                <span style="color:#6b7280; font-weight:600;">⏱️ 全局计时</span>
                <span class="timer-display" id="timerDisplay">00:00</span>
                <div class="timer-controls">
                    <button class="btn btn-success" id="startTimerBtn" onclick="startTimer()">▶ 开始</button>
                    <button class="btn btn-warning" onclick="pauseTimer()">⏸️ 暂停</button>
                    <button class="btn btn-gray" onclick="resetTimer()">↺ 重置</button>
                </div>
            </div>
        </div>

        <!-- 1. 题库管理区 -->
        <div class="panel">
            <div class="panel-header">
                <span>📋 城市题库管理</span>
                <button class="btn btn-danger" onclick="resetGame()">重置进度</button>
            </div>
            <textarea id="batchInput" placeholder="每行一个题目，多字词用空格隔开&#10;例如：&#10;bei jing&#10;shang hai&#10;guang zhou"></textarea>
            <div class="action-btns">
                <button class="btn btn-primary" onclick="addBatchCities()">批量添加</button>
                <button class="btn btn-gray" onclick="clearCities()">清空题库</button>
            </div>
        </div>

        <!-- 2. 游戏主控制台 -->
        <div class="panel">
            <div class="panel-header">
                <span>🎮 题目控制台</span>
                <span style="font-size:13px; color:#6b7280;">点击字母开启/关闭 | 每题独立揭示</span>
            </div>
            <div id="cityList"></div>
            <div id="keyboard" class="keyboard"></div>
        </div>

        <!-- 3. 底部状态输出 -->
        <div class="panel">
            <div class="panel-header"><span>📊 实时状态输出</span></div>
            <div id="outputPanel" class="output-panel">
                <button class="copy-btn" onclick="copyOutput()">复制</button>
                <span id="outputText">等待游戏开始...</span>
            </div>
        </div>
    </div>

    <!-- 右侧：玩家管理面板 -->
    <div class="player-panel">
        <div class="panel">
            <div class="panel-header"><span>👥 玩家计分板</span></div>
            <div class="player-input-row">
                <input type="text" id="newPlayerName" placeholder="输入玩家名字" onkeypress="if(event.key==='Enter')addPlayer()">
                <button class="btn btn-primary" onclick="addPlayer()">添加</button>
            </div>
            <div id="playerList"></div>
        </div>
    </div>
</div>

<script>
    // ------- 计时器模块 -------
    let timerSeconds = 0;
    let timerInterval = null;
    let timerRunning = false;
    const timerDisplay = document.getElementById('timerDisplay');

    function formatTime(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateTimerDisplay() {
        timerDisplay.textContent = formatTime(timerSeconds);
    }

    function startTimer() {
        if (timerRunning) return;
        timerRunning = true;
        document.getElementById('startTimerBtn').textContent = '▶ 运行中';
        timerInterval = setInterval(() => {
            timerSeconds++;
            updateTimerDisplay();
            updateOutputPanel(); // 新增：每秒同步刷新状态面板
        }, 1000);
    }

    function pauseTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerRunning = false;
        document.getElementById('startTimerBtn').textContent = '▶ 继续';
    }

    function resetTimer() {
        pauseTimer();
        timerSeconds = 0;
        updateTimerDisplay();
        document.getElementById('startTimerBtn').textContent = '▶ 开始';
        // 同时清除所有题目的答题用时记录（仅当重置计时器时，清除记录，但保留揭示状态）
        state.cities.forEach(c => {
            if (c.solveTime !== undefined) delete c.solveTime;
        });
        renderAll();
    }

    // 记录某一题的完成时间（秒）
    function markSolveTime(index) {
        if (state.cities[index] && !state.cities[index].isAnswerRevealed) {
            // 只有在未揭示状态下记录（防止覆盖）
            state.cities[index].solveTime = timerSeconds;
        }
    }

    // ------- 游戏核心 -------
    const LETTERS = 'a b c d e f g h i j k l m n o p q r s t u v w x y z'.split(' ');
    
    let state = {
        cities: [],          // { pinyin, revealed: Set, isAnswerRevealed, solveTime }
        usedLetters: [],
        players: []          // { name, score }
    };

    function initKeyboard() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        LETTERS.forEach(letter => {
            const key = document.createElement('div');
            key.className = 'key';
            key.textContent = letter.toUpperCase();
            key.dataset.letter = letter;
            key.onclick = () => toggleLetter(letter);
            kb.appendChild(key);
        });
    }

    function addBatchCities() {
        const textarea = document.getElementById('batchInput');
        const lines = textarea.value.trim().split('\n').filter(l => l.trim() !== '');
        lines.forEach(line => {
            const trimmed = line.trim().toLowerCase();
            if (trimmed) {
                state.cities.push({ pinyin: trimmed, revealed: new Set(), isAnswerRevealed: false, solveTime: undefined });
            }
        });
        textarea.value = '';
        renderAll();
    }

    function clearCities() {
        if(confirm('确定清空所有城市吗？')) {
            state.cities = [];
            state.usedLetters = [];
            renderAll();
        }
    }

    function resetGame() {
        if(state.cities.length === 0 || confirm('确定重置所有题目的进度吗？')) {
            state.usedLetters = [];
            state.cities.forEach(c => { c.revealed.clear(); c.isAnswerRevealed = false; c.solveTime = undefined; });
            renderAll();
        }
    }

    function toggleLetter(letter) {
        const idx = state.usedLetters.indexOf(letter);
        if (idx > -1) {
            state.usedLetters.splice(idx, 1);
            state.cities.forEach(c => {
                for(let k = 0; k < c.pinyin.length; k++) {
                    if (c.pinyin[k] === letter) c.revealed.delete(k);
                }
            });
        } else {
            state.usedLetters.push(letter);
            state.cities.forEach(c => {
                for(let k = 0; k < c.pinyin.length; k++) {
                    if (c.pinyin[k] === letter) c.revealed.add(k);
                }
            });
        }
        renderAll();
    }

    // 揭示答案：同时记录用时（如果计时器正在运行或已停止，都记录当前timerSeconds）
    function revealAnswer(index) {
        const city = state.cities[index];
        if (city.isAnswerRevealed) return;
        city.isAnswerRevealed = true;
        // 记录当前计时器时间（秒）
        city.solveTime = timerSeconds;
        renderAll();
    }

    function undoReveal(index) {
        const city = state.cities[index];
        city.isAnswerRevealed = false;
        city.solveTime = undefined;
        renderAll();
    }

    // 玩家管理
    function addPlayer() {
        const input = document.getElementById('newPlayerName');
        const name = input.value.trim();
        if (!name) return;
        state.players.push({ name, score: 0 });
        input.value = '';
        renderAll();
    }

    function removePlayer(index) {
        if(confirm(`确定删除玩家 "${state.players[index].name}" 吗？`)) {
            state.players.splice(index, 1);
            renderAll();
        }
    }

    function updateScore(index, delta) {
        state.players[index].score += delta;
        renderAll();
    }

    function renamePlayer(index) {
        const newName = prompt('输入新名字：', state.players[index].name);
        if (newName && newName.trim()) {
            state.players[index].name = newName.trim();
            renderAll();
        }
    }

    // 渲染所有 UI
    function renderAll() {
        renderCityList();
        updateKeyboardUI();
        renderPlayerList();
        updateOutputPanel();
    }

    function renderCityList() {
        const list = document.getElementById('cityList');
        if (state.cities.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:30px; color:#9ca3af;">暂无题目，请先添加</div>';
            return;
        }
        list.innerHTML = state.cities.map((c, i) => {
            let displayText = '';
            if (c.isAnswerRevealed) {
                displayText = `<span class="revealed-text">${c.pinyin.toUpperCase()}</span>`;
            } else {
                let formatted = '';
                for(let k = 0; k < c.pinyin.length; k++) {
                    const ch = c.pinyin[k];
                    formatted += (ch === ' ') ? '&nbsp;&nbsp;' : (c.revealed.has(k) ? `<span class="highlight">${ch.toUpperCase()}</span>` : '*');
                }
                displayText = formatted;
            }
            // 显示用时
            const timeStr = c.solveTime !== undefined ? `⏱️ ${formatTime(c.solveTime)}` : '';
            return `
                <div class="city-row">
                    <div class="city-pinyin">${i + 1}. ${displayText}</div>
                    <div class="city-actions">
                        <span class="timer-badge">${timeStr}</span>
                        <span class="answer-text">${c.pinyin.toUpperCase()}</span>
                        <button class="btn btn-warning btn-sm" onclick="revealAnswer(${i})" ${c.isAnswerRevealed ? 'disabled' : ''}>揭示</button>
                        <button class="btn btn-gray btn-sm" onclick="undoReveal(${i})" ${!c.isAnswerRevealed ? 'disabled' : ''}>撤销</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPlayerList() {
        const list = document.getElementById('playerList');
        if (state.players.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:20px; color:#9ca3af; font-size:14px;">暂无玩家</div>';
            return;
        }
        list.innerHTML = state.players.map((p, i) => `
            <div class="player-item">
                <div class="player-name" onclick="renamePlayer(${i})" title="点击修改名字">${p.name}</div>
                <div class="player-score">${p.score}</div>
                <div class="player-btns">
                    <button class="btn btn-success btn-sm" onclick="updateScore(${i}, 1)">+1</button>
                    <button class="btn btn-danger btn-sm" onclick="updateScore(${i}, -1)">-1</button>
                    <button class="btn btn-gray btn-sm" onclick="removePlayer(${i})">✕</button>
                </div>
            </div>
        `).join('');
    }

    function updateKeyboardUI() {
        document.querySelectorAll('.key').forEach(key => {
            const letter = key.dataset.letter;
            key.classList.toggle('active', state.usedLetters.includes(letter));
        });
    }

    // 状态输出面板（包含用时信息）
    function updateOutputPanel() {
        const textEl = document.getElementById('outputText');
        let output = '';

        if (state.cities.length === 0) {
            output = '等待游戏开始...';
        } else {
            output += '【当前进度】\n';
            state.cities.forEach((c, i) => {
                let line = '';
                if (c.isAnswerRevealed) {
                    line = `${i + 1}. ${c.pinyin.toUpperCase()}`;
                    if (c.solveTime !== undefined) {
                        line += `  (用时 ${formatTime(c.solveTime)})`;
                    }
                } else {
                    let formatted = '';
                    for(let k = 0; k < c.pinyin.length; k++) {
                        const ch = c.pinyin[k];
                        formatted += (ch === ' ') ? ' ' : (c.revealed.has(k) ? ch.toUpperCase() : '*');
                    }
                    line = `${i + 1}. ${formatted}`;
                }
                output += line + '\n';
            });

            output += '\n【已开字母】 ';
            output += state.usedLetters.length > 0 ? state.usedLetters.map(l => l.toUpperCase()).join(' ') : '无';

            output += `\n【计时】 ${formatTime(timerSeconds)}`;

            if (state.players.length > 0) {
                output += '\n\n【玩家得分】\n';
                state.players.forEach(p => {
                    output += `${p.name}: ${p.score}\n`;
                });
            }
        }

        textEl.innerHTML = output;
    }

    function copyOutput() {
        const text = document.getElementById('outputText').innerText;
        const btn = document.querySelector('.copy-btn');
        
        function showSuccess() {
            const oldText = btn.textContent;
            btn.textContent = '✅ 已复制';
            setTimeout(() => btn.textContent = oldText, 1500);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showSuccess).catch(fallbackCopy);
        } else {
            fallbackCopy();
        }

        function fallbackCopy() {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showSuccess();
            } catch (err) {
                alert('复制失败，请手动选中文字复制');
            }
            document.body.removeChild(textarea);
        }
    }

    // 初始化
    initKeyboard();
    renderAll();
    updateTimerDisplay();

    // 额外：当点击揭示时自动记录用时
    // 已通过 revealAnswer 内部调用 timerSeconds
</script>
</body>
</html>
