<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼音开字母 · 水平展示</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #eef5f9;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 28px 24px 32px;
            box-shadow: 0 16px 40px rgba(0,20,30,0.15);
            border: 1px solid rgba(255,255,255,0.6);
        }
        h1 {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            font-size: 2.0rem;
            font-weight: 600;
            color: #1a3b4d;
            border-bottom: 2px dashed #b6d2e0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            background: #dbeaf3;
            padding: 4px 20px;
            border-radius: 40px;
            color: #1f4b5e;
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
            background: #d7e6ef70;
            padding: 16px 24px;
            border-radius: 60px;
            margin-bottom: 28px;
            backdrop-filter: blur(2px);
        }
        .top-bar label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: #1f4459;
        }
        .top-bar input[type="number"] {
            width: 80px;
            padding: 8px 6px;
            border-radius: 40px;
            border: 1px solid #b8cfdc;
            background: white;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
        }
        .top-bar button {
            background: #2b5d77;
            border: none;
            color: white;
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 6px 0 #15323f, 0 4px 12px rgba(0,20,30,0.2);
            cursor: pointer;
            transition: 0.06s linear;
            border: 1px solid #5f8ba3;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .top-bar button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #15323f;
        }
        .top-bar button.secondary {
            background: #628a9e;
            box-shadow: 0 5px 0 #3a5b6b;
        }
        .top-bar button.danger {
            background: #b14545;
            box-shadow: 0 5px 0 #6f2a2a;
            border-color: #c96a6a;
        }
        .top-bar button.success {
            background: #3a8a5a;
            box-shadow: 0 5px 0 #1f5a3a;
            border-color: #5aad7a;
        }
        .import-area {
            background: #eef5f9;
            border-radius: 40px;
            padding: 12px 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            border: 1px dashed #7fa3b7;
        }
        .import-area label {
            font-weight: 500;
            color: #1a3b4d;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1 1 200px;
        }
        .import-area input[type="file"] {
            font-size: 0.85rem;
            background: white;
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #bfd7e4;
            flex: 1 1 180px;
        }
        .file-status {
            background: #d2e3ed;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #1f4b5e;
        }
        .region-label {
            background: #c0d9e8;
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #0d3142;
            font-weight: 600;
        }
        .global-letters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 10px;
            background: #dce8f0;
            padding: 14px 12px;
            border-radius: 60px;
            margin: 14px 0 22px;
            border: 1px solid #b8cfdc;
        }
        .global-letter {
            width: 46px;
            height: 46px;
            border-radius: 30px;
            background: #dae8f1;
            border: 1px solid #b1ccdd;
            font-weight: 700;
            font-size: 1.3rem;
            color: #15323f;
            box-shadow: 0 4px 0 #889faf;
            cursor: pointer;
            transition: all 0.04s linear;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            user-select: none;
        }
        .global-letter:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #6a8393;
        }
        .global-letter.active {
            background: #c0d9e8;
            border-color: #7fa3b7;
            box-shadow: 0 2px 0 #5f7b8b;
            transform: translateY(2px);
        }
        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 18px 0 28px;
        }
        .question-row {
            background: white;
            border-radius: 24px;
            padding: 14px 20px;
            box-shadow: 0 4px 12px rgba(0,20,30,0.05);
            border: 1px solid #d4e3ed;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            transition: all 0.1s;
        }
        .question-row.correct {
            background: #eaf7ef;
            border-color: #8bc4a0;
        }
        .question-row .index-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #6a8a9a;
            min-width: 28px;
            text-align: center;
        }
        .pinyin-horizontal {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            background: #eef5fa;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #c7dbe7;
            min-height: 48px;
            flex: 1 1 200px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #08212e;
        }
        .pinyin-horizontal .char {
            display: inline-block;
            min-width: 28px;
            text-align: center;
            padding: 2px 2px;
            border-radius: 4px;
            transition: 0.08s;
        }
        .pinyin-horizontal .char.revealed {
            background: #c0d9e8;
            color: #0a2b3b;
        }
        .pinyin-horizontal .char.hidden {
            color: #b0c8d6;
            background: #eaf1f6;
        }
        .pinyin-horizontal .char.correct-reveal {
            background: #8bc4a0;
            color: #0a2b3b;
        }
        .pinyin-horizontal .space-char {
            display: inline-block;
            min-width: 12px;
        }
        .question-row .answer-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex: 0 1 auto;
        }
        .question-row .answer-section input {
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid #b8d0dd;
            font-size: 0.95rem;
            background: white;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            width: 140px;
        }
        .question-row .answer-section input:disabled {
            background: #f0f5f8;
            color: #2a5b72;
        }
        .question-row .answer-section button {
            background: #2f6d7e;
            border: none;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 0 #1a4350;
            cursor: pointer;
            transition: 0.05s linear;
            border: 1px solid #5a8ca0;
            white-space: nowrap;
        }
        .question-row .answer-section button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1a4350;
        }
        .question-row .answer-section button:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1a4350;
            cursor: not-allowed;
        }
        .question-row .status-badge {
            font-size: 0.85rem;
            font-weight: 500;
            padding: 4px 16px;
            border-radius: 30px;
            background: #eaf1f6;
            color: #1f4b5e;
            white-space: nowrap;
            min-width: 70px;
            text-align: center;
        }
        .badge-correct { background: #9ed0b0; color: #1a4f2e; }
        .badge-wrong { background: #f7c5c5; color: #8f3a3a; }
        .badge-answer { background: #d4e3ed; color: #1f4459; }
        .timer-box {
            background: #1f4459;
            color: white;
            padding: 6px 24px;
            border-radius: 60px;
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
            display: inline-block;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
        }
        .timer-box:hover {
            opacity: 0.85;
        }
        .timer-box.paused {
            background: #5a7a8a;
        }
        .footer-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 16px;
            background: #ddecf5;
            border-radius: 60px;
            padding: 10px 24px;
        }
        .message-area {
            font-size: 0.95rem;
            background: #d2e3ed;
            padding: 4px 24px;
            border-radius: 40px;
            color: #1f4b5e;
        }
        .reset-all-btn {
            background: #48778e;
            border: none;
            color: white;
            padding: 6px 22px;
            border-radius: 60px;
            font-weight: 600;
            box-shadow: 0 4px 0 #2c5366;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .reset-all-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #2c5366;
        }
        .answer-display {
            font-size: 0.95rem;
            color: #1a4f6e;
            background: #e6f0f7;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 600;
        }
        .answer-display.correct-answer {
            background: #8bc4a0;
            color: #0a3b1e;
        }
        .time-display {
            font-size: 0.75rem;
            color: #4a6a7a;
            background: #eaf1f6;
            padding: 2px 12px;
            border-radius: 16px;
            font-weight: 500;
            white-space: nowrap;
        }

        .summary-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 24px;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .summary-panel {
            background: white;
            border-radius: 48px;
            max-width: 720px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px 36px 36px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .summary-panel h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a3b4d;
            text-align: center;
            border-bottom: 2px solid #dce8f0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 24px;
            background: #f0f6fa;
            border-radius: 28px;
            padding: 18px 24px;
            margin-bottom: 22px;
        }
        .summary-stats .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        .summary-stats .stat-item .label {
            font-size: 0.9rem;
            color: #3a6379;
        }
        .summary-stats .stat-item .value {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0d3142;
        }
        .summary-detail-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .summary-detail-table th {
            text-align: left;
            padding: 8px 8px 8px 0;
            font-weight: 600;
            color: #1f4459;
            border-bottom: 1px solid #d4e3ed;
        }
        .summary-detail-table td {
            padding: 6px 8px 6px 0;
            border-bottom: 1px solid #eaf1f6;
            color: #1a3b4d;
        }
        .summary-detail-table .correct-row td {
            color: #1a4f2e;
        }
        .summary-detail-table .wrong-row td {
            color: #8f3a3a;
        }
        .summary-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }
        .summary-buttons button {
            padding: 10px 32px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.06s linear;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }
        .summary-buttons button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
        }
        .summary-buttons .btn-primary {
            background: #2b5d77;
            color: white;
        }
        .summary-buttons .btn-secondary {
            background: #d4e3ed;
            color: #1f4459;
        }
        .summary-buttons .btn-success {
            background: #3a8a5a;
            color: white;
        }
        .summary-close {
            margin-top: 16px;
            text-align: center;
        }
        .summary-close button {
            background: transparent;
            border: 1px solid #b8d0dd;
            padding: 6px 28px;
            border-radius: 40px;
            color: #3a6379;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .summary-close button:hover {
            background: #eaf1f6;
        }

        @media (max-width: 650px) {
            .app { padding: 16px; }
            .question-row { flex-direction: column; align-items: stretch; gap: 10px; }
            .pinyin-horizontal { font-size: 1.2rem; gap: 4px 8px; }
            .pinyin-horizontal .char { min-width: 22px; }
            .question-row .answer-section { justify-content: center; }
            .question-row .answer-section input { width: 100%; }
            .summary-panel { padding: 24px 20px; }
            .summary-stats { grid-template-columns: 1fr; }
            .summary-buttons button { flex: 1; min-width: 120px; }
        }
        /* ===== 新增：开字母主界面样式 ===== */
        #openLetterHome {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #dfe9f5 0%, #f9fafc 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }
        #openLetterHome h1 { border: none; padding: 0; margin: 0; font-size: 3rem; color: #2b4c8c; text-shadow: 0 2px 10px rgba(74,108,247,0.2); display: flex; align-items: center; gap: 15px; }
        #openLetterHome p { color: #5b6b82; font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 20px; }
        .home-menu { display: flex; flex-direction: column; gap: 15px; width: 320px; }
        .home-menu button { padding: 18px; border-radius: 16px; border: none; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .home-menu button.btn-play { background: #2b5d77; color: white; box-shadow: 0 6px 15px rgba(43,93,119,0.3); }
        .home-menu button.btn-play:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43,93,119,0.4); }
        .home-menu button.btn-disabled { background: #e0e0e0; color: #888; cursor: not-allowed; }
                /* ===== 好友对决面板样式 ===== */
        #battleScreen { position: fixed; inset: 0; z-index: 9999; background: #f3f4f6; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .battle-container { max-width: 1000px; margin: 0 auto; width: 100%; display: flex; gap: 20px; }
        .battle-main { flex: 1; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; min-height: 80vh; }
        .battle-side { width: 300px; display: flex; flex-direction: column; gap: 20px; }
        
        .battle-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .battle-players { display: flex; flex-wrap: wrap; gap: 10px; background: #f9fafb; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .player-tag { background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
        .player-tag { display: inline-flex; align-items: center; gap: 6px; }
        .player-tag button { padding: 2px 6px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-mute { background: #f59e0b; }
        .btn-kick { background: #ef4444; }

        .battle-questions { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .bq-item { background: #f3f4f6; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-family: monospace; font-size: 20px; font-weight: bold; }
        .bq-item.correct { background: #dcfce7; color: #166534; text-decoration: line-through; }
        
        .battle-chat-box { background: white; border-radius: 12px; display: flex; flex-direction: column; height: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .chat-msg { word-break: break-all; }
        .chat-msg.system { color: #ef4444; font-weight: bold; text-align: center; }
        .chat-msg.correct { color: #10b981; font-weight: bold; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #eee; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        .chat-input-area button { padding: 8px 16px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        .battle-controls { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<!-- 新增的开字母主界面 -->
<div id="openLetterHome" style="position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg, #dfe9f5 0%, #f9fafc 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;">
    <h1 style="border: none; padding: 0; margin: 0; font-size: 3rem; color: #2b4c8c; text-shadow: 0 2px 10px rgba(74,108,247,0.2); display: flex; align-items: center; gap: 15px;">🔤 开字母猜地名</h1>
    <p style="color: #5b6b82; font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 20px;">逐字母揭示，考验地名储备</p>
    <div style="display: flex; flex-direction: column; gap: 15px; width: 320px;">
        <button id="btnSinglePlayer" style="padding: 18px; border-radius: 16px; border: none; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: all 0.2s; background: #2b5d77; color: white; box-shadow: 0 6px 15px rgba(43,93,119,0.3);">🎮 单机练习模式</button>
                <button id="btnHostScreen" style="padding: 18px; border-radius: 16px; border: none; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: all 0.2s; background: #628a9e; color: white; box-shadow: 0 6px 15px rgba(98,138,158,0.3);">🎤 主持人大屏</button>
        <button id="btnBattleMode" style="padding: 18px; border-radius: 16px; border: none; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: all 0.2s; background: #4f46e5; color: white; box-shadow: 0 6px 15px rgba(79,70,229,0.3);">⚔️ 好友对决</button>
    </div>
</div>

<!-- 好友对决模式 -->
<div id="battleScreen">
    <!-- 大厅 -->
    <div id="battleLobby" style="max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; margin-bottom: 20px; color: #2b4c8c;">⚔️ 好友对决</h2>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">你的昵称</label>
            <input type="text" id="battleNameInput" placeholder="输入昵称" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
        </div>
        <button id="btnCreateRoom" style="width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-bottom: 15px; cursor: pointer;">🏠 创建房间 (当裁判)</button>
        
        <div style="text-align: center; margin-bottom: 15px; color: #999;">— 或 —</div>
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="battleRoomInput" placeholder="输入6位房间号" maxlength="6" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-transform: uppercase;">
            <button id="btnJoinRoom" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">🚪 加入</button>
        </div>

        // ===== 在这里粘贴您的题库 =====

        // ---------- 解析题库 ----------
        function parseTextToDB(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            const result = [];
            let region = '全国';
            let startIdx = 0;

            if (lines.length > 0) {
                const firstLine = lines[0].trim();
                // 判断第一行是否为地区标签（不包含逗号，且是中文或英文）
                if (!firstLine.includes(',') && /^[\u4e00-\u9fa5a-zA-Z]+$/.test(firstLine)) {
                    region = firstLine;
                    startIdx = 1;
                }
            }

            for (let i = startIdx; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split(',').map(s => s.trim());
                if (parts.length >= 2) {
                    const name = parts[0];
                    const pinyin = parts[1].toLowerCase().replace(/\s+/g, ' ').trim();
                    if (name && pinyin) result.push({ name, pinyin });
                }
            }
            return { data: result, region: region };
        }

        // ---------- 游戏状态 ----------
        let fullDB = [];
        let currentQuestions = [];
        let revealedMap = new Map();
        let permanentRevealMap = new Map();
        let isCorrectMap = new Map();
        let correctTimeMap = new Map();
        let timerInterval = null;
        let seconds = 0;
        let isPaused = false;
        let gameActive = false;
        let currentRegion = '全国';

        // DOM 引用
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const regionLabel = document.getElementById('regionLabel');
        const loadDefaultBtn = document.getElementById('loadDefaultBtn');
        const autoLoadBtn = document.getElementById('autoLoadBtn');
        const questionCountInput = document.getElementById('questionCount');
        const restartBtn = document.getElementById('restartBtn');
        const resetRevealBtn = document.getElementById('resetRevealBtn');
        const resetAllBtn = document.getElementById('resetAllBtn');
        const quitBtn = document.getElementById('quitBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const gameMessage = document.getElementById('gameMessage');
        const questionsContainer = document.getElementById('questionsContainer');
        const globalLettersDiv = document.getElementById('globalLetters');

        // ---------- 辅助函数 ----------
        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function formatTimeChinese(sec) {
            if (!sec || sec < 0) return '0秒';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            if (m > 0 && s > 0) return `${m}分${s}秒`;
            if (m > 0) return `${m}分`;
            return `${s}秒`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function startTimer() {
            stopTimer();
            seconds = 0;
            timerDisplay.textContent = formatTime(0);
            isPaused = false;
            timerDisplay.classList.remove('paused');
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    seconds++;
                    timerDisplay.textContent = formatTime(seconds);
                }
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            seconds = 0;
            timerDisplay.textContent = formatTime(0);
            isPaused = false;
            timerDisplay.classList.remove('paused');
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            timerDisplay.classList.toggle('paused', isPaused);
            gameMessage.textContent = isPaused ? '⏸️ 计时暂停' : '▶️ 计时继续';
        }

        function resetAllReveals() {
            revealedMap.clear();
            renderGlobalLetters();
            renderAllQuestions();
            gameMessage.textContent = '🔄 字母已重置（已答对的保留）';
        }

        // ---------- 渲染 26 个字母 ----------
        function renderGlobalLetters() {
            const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
            let html = '';
            for (let letter of letters) {
                const isRevealed = revealedMap.get(letter) === true;
                let cls = 'global-letter';
                if (isRevealed) cls += ' active';
                html += `<button class="${cls}" data-letter="${letter}">${letter.toUpperCase()}</button>`;
            }
            globalLettersDiv.innerHTML = html;

            document.querySelectorAll('.global-letter').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const letter = this.dataset.letter;
                    const current = revealedMap.get(letter) || false;
                    revealedMap.set(letter, !current);
                    renderGlobalLetters();
                    renderAllQuestions();
                    gameMessage.textContent = `🔤 字母 ${letter.toUpperCase()} ${!current ? '已揭示' : '已隐藏'}`;
                });
            });
        }

        function isLetterRevealedForQuestion(letter, idx) {
            if (isCorrectMap.get(idx) === true) return true;
            if (revealedMap.get(letter) === true) return true;
            const permMap = permanentRevealMap.get(idx);
            if (permMap && permMap.get(letter) === true) return true;
            return false;
        }

        function renderPinyinHorizontal(pinyin, idx) {
            if (!pinyin) return '<span>暂无</span>';
            let html = '';
            const chars = pinyin.split('');
            let i = 0;
            while (i < chars.length) {
                const ch = chars[i];
                if (ch === ' ') {
                    html += '<span class="space-char"></span>';
                    i++;
                } else {
                    const lower = ch.toLowerCase();
                    const revealed = isLetterRevealedForQuestion(lower, idx);
                    const cls = revealed ? 'char revealed' : 'char hidden';
                    html += `<span class="${cls}">${revealed ? ch : '*'}</span>`;
                    i++;
                }
            }
            return html;
        }

        function renderAllQuestions() {
            if (!currentQuestions.length) {
                questionsContainer.innerHTML = `<div style="text-align:center; padding:40px; color:#3a6379;">暂无题目，请点击「再来一局」</div>`;
                return;
            }
            let html = '';
            currentQuestions.forEach((q, idx) => {
                const isCorrect = isCorrectMap.get(idx) === true;
                const pinyinHtml = renderPinyinHorizontal(q.pinyin, idx);
                const statusText = isCorrect ? '✅ 已答对' : '⏳ 待答题';
                const statusClass = isCorrect ? 'badge-correct' : '';
                const rowClass = isCorrect ? 'question-row correct' : 'question-row';
                const answerDisplay = isCorrect ? `<span class="answer-display correct-answer">📖 ${q.name}</span>` : '';
                const timeDisplay = isCorrect && correctTimeMap.has(idx) ?
                    `<span class="time-display">⏱ ${formatTime(correctTimeMap.get(idx))}</span>` : '';

                html += `
                    <div class="${rowClass}" id="row-${idx}">
                        <span class="index-label">#${idx+1}</span>
                        <div class="pinyin-horizontal">${pinyinHtml}</div>
                        <div class="answer-section">
                            <input type="text" id="input-${idx}" placeholder="输入地名" autocomplete="off" ${isCorrect ? 'disabled' : ''}>
                            <button data-idx="${idx}" class="check-btn" ${isCorrect ? 'disabled' : ''}>判断</button>
                            ${answerDisplay}
                            ${timeDisplay}
                        </div>
                        <div class="status-badge ${statusClass}" id="status-${idx}">${statusText}</div>
                    </div>
                `;
            });
            questionsContainer.innerHTML = html;

            document.querySelectorAll('.check-btn:not([disabled])').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const idx = parseInt(this.dataset.idx, 10);
                    handleCheck(idx);
                });
            });
            document.querySelectorAll('.question-row input:not([disabled])').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const row = this.closest('.question-row');
                        const btn = row.querySelector('.check-btn:not([disabled])');
                        if (btn) btn.click();
                    }
                });
            });
        }

        // ---------- 判断逻辑 ----------
        function handleCheck(idx) {
            if (idx < 0 || idx >= currentQuestions.length) return;
            if (isCorrectMap.get(idx) === true) {
                gameMessage.textContent = '⏳ 本题已答对';
                return;
            }
            const q = currentQuestions[idx];
            const inputField = document.getElementById(`input-${idx}`);
            const statusBadge = document.getElementById(`status-${idx}`);
            if (!inputField || !statusBadge) return;

            const val = inputField.value.trim();
            if (val === '') {
                gameMessage.textContent = '📝 请输入地名';
                return;
            }

            const normalizedInput = val.replace(/\s+/g, '');
            const normalizedName = q.name.replace(/\s+/g, '');
            if (normalizedInput === normalizedName) {
                isCorrectMap.set(idx, true);
                correctTimeMap.set(idx, seconds);
                const permMap = new Map();
                const letters = q.pinyin.replace(/ /g, '').split('');
                letters.forEach(ch => permMap.set(ch.toLowerCase(), true));
                permanentRevealMap.set(idx, permMap);

                statusBadge.textContent = '✅ 已答对';
                statusBadge.className = 'status-badge badge-correct';
                gameMessage.textContent = `🎉 第 ${idx+1} 题正确！答案是 ${q.name}`;
                inputField.disabled = true;
                const btn = document.querySelector(`#row-${idx} .check-btn`);
                if (btn) btn.disabled = true;
                const row = document.querySelector(`#row-${idx}`);
                if (row) row.classList.add('correct');

                renderAllQuestions();

                const total = currentQuestions.length;
                let correctCount = 0;
                for (let i = 0; i < total; i++) {
                    if (isCorrectMap.get(i) === true) correctCount++;
                }
                if (correctCount === total) {
                    showSummary('🎉 全部答对！');
                }
            } else {
                statusBadge.textContent = '❌ 错误';
                statusBadge.className = 'status-badge badge-wrong';
                gameMessage.textContent = `❌ “${val}” 不正确`;
                setTimeout(() => {
                    if (!isCorrectMap.get(idx)) {
                        statusBadge.textContent = '⏳ 待答题';
                        statusBadge.className = 'status-badge';
                    }
                }, 1800);
            }
        }

        // ---------- 结算面板 ----------
        function showSummary(title = '📊 结算报告') {
            stopTimer();
            gameActive = false;

            const total = currentQuestions.length;
            let correctCount = 0;
            let totalTime = 0;
            let detailRows = '';

            for (let i = 0; i < total; i++) {
                const q = currentQuestions[i];
                const isCorrect = isCorrectMap.get(i) === true;
                const time = correctTimeMap.get(i) || 0;
                if (isCorrect) {
                    correctCount++;
                    totalTime += time;
                }
                const statusText = isCorrect ? '✅ 正确' : '❌ 未答/错误';
                const rowClass = isCorrect ? 'correct-row' : 'wrong-row';
                const timeStr = isCorrect ? formatTime(time) : '—';
                detailRows += `
                    <tr class="${rowClass}">
                        <td>#${i+1}</td>
                        <td>${q.name}</td>
                        <td>${q.pinyin}</td>
                        <td>${statusText}</td>
                        <td>${timeStr}</td>
                    </tr>
                `;
            }

            let avgTimeDisplay = '—';
            if (correctCount > 0 && seconds > 0) {
                const avgSeconds = seconds / correctCount;
                avgTimeDisplay = formatTimeChinese(avgSeconds) + '/题';
            }

            const totalStr = formatTime(seconds);

            const overlay = document.createElement('div');
            overlay.className = 'summary-overlay';
            overlay.id = 'summaryOverlay';
            overlay.innerHTML = `
                <div class="summary-panel">
                    <h2>${title}</h2>
                    <div class="summary-stats">
                        <div class="stat-item"><span class="label">总耗时</span><span class="value">${totalStr}</span></div>
                        <div class="stat-item"><span class="label">答对 / 总数</span><span class="value">${correctCount} / ${total}</span></div>
                        <div class="stat-item"><span class="label">平均用时</span><span class="value">${avgTimeDisplay}</span></div>
                        <div class="stat-item"><span class="label">正确率</span><span class="value">${total > 0 ? Math.round(correctCount/total*100) : 0}%</span></div>
                        <div class="stat-item" style="grid-column:1/-1;"><span class="label">当前地区</span><span class="value">${currentRegion}</span></div>
                    </div>
                    <table class="summary-detail-table">
                        <thead>
                            <tr><th>#</th><th>地名</th><th>拼音</th><th>状态</th><th>用时</th></tr>
                        </thead>
                        <tbody>${detailRows}</tbody>
                    </table>
                    <div class="summary-buttons">
                        <button class="btn-success" onclick="window.restartGame()">🔁 再来一局</button>
                        <button class="btn-secondary" onclick="window.closeSummary()">关闭</button>
                    </div>
                    <div class="summary-close">
                        <button onclick="window.closeSummary()">✕ 关闭</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            window.restartGame = function() {
                closeSummary();
                restartGame();
            };
            window.closeSummary = function() {
                const el = document.getElementById('summaryOverlay');
                if (el) el.remove();
                if (gameActive) {
                    startTimer();
                }
            };
        }

        // ---------- 核心：再来一局 ----------
        function restartGame() {
            if (fullDB.length === 0) {
                gameMessage.textContent = '⚠️ 题库为空，请导入';
                return;
            }
            let count = parseInt(questionCountInput.value, 10);
            if (isNaN(count) || count < 1) count = 1;
            if (count > fullDB.length) count = fullDB.length;

            const shuffled = [...fullDB];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            currentQuestions = shuffled.slice(0, count);
            revealedMap.clear();
            permanentRevealMap.clear();
            isCorrectMap.clear();
            correctTimeMap.clear();
            gameActive = true;
            isPaused = false;

            resetTimer();
            startTimer();

            renderGlobalLetters();
            renderAllQuestions();
            gameMessage.textContent = `🔁 新的一局！共 ${currentQuestions.length} 题，加油！`;
        }

        // ---------- 放弃功能 ----------
        function quitGame() {
            if (!gameActive || currentQuestions.length === 0) {
                gameMessage.textContent = '⚠️ 没有进行中的游戏';
                return;
            }
            stopTimer();
            for (let i = 0; i < currentQuestions.length; i++) {
                if (!isCorrectMap.get(i)) {
                    const q = currentQuestions[i];
                    const permMap = new Map();
                    const letters = q.pinyin.replace(/ /g, '').split('');
                    letters.forEach(ch => permMap.set(ch.toLowerCase(), true));
                    permanentRevealMap.set(i, permMap);
                    isCorrectMap.set(i, false);
                }
            }
            renderAllQuestions();
            showSummary('🚪 已放弃 · 答案公布');
        }

        // ---------- 加载数据库 ----------
        function loadDatabase(dataArray, regionName = '全国') {
            if (!dataArray || dataArray.length === 0) {
                fileStatus.textContent = '⚠️ 空数据';
                return false;
            }
            fullDB = dataArray.filter(item => item.name && item.pinyin);
            if (fullDB.length === 0) {
                fileStatus.textContent = '⚠️ 无效数据';
                return false;
            }
            currentRegion = regionName;
            regionLabel.textContent = `📍 当前地区：${currentRegion}`;
            fileStatus.textContent = `✅ ${fullDB.length} 条`;
            currentQuestions = [];
            revealedMap.clear();
            permanentRevealMap.clear();
            isCorrectMap.clear();
            correctTimeMap.clear();
            gameActive = false;
            resetTimer();
            renderGlobalLetters();
            renderAllQuestions();
            gameMessage.textContent = `📚 已加载 ${fullDB.length} 个地名（${currentRegion}）`;
            return true;
        }

        // ---------- 解析 CSV ----------
        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            const result = [];
            let region = '全国';
            let startIdx = 0;

            if (lines.length > 0) {
                const firstLine = lines[0].trim();
                if (!firstLine.includes(',') && /^[\u4e00-\u9fa5a-zA-Z]+$/.test(firstLine)) {
                    region = firstLine;
                    startIdx = 1;
                }
            }

            for (let i = startIdx; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split(',').map(s => s.trim());
                if (parts.length >= 2) {
                    const name = parts[0];
                    const pinyin = parts[1].toLowerCase().replace(/\s+/g, ' ').trim();
                    if (name && pinyin) result.push({ name, pinyin });
                }
            }
            return { data: result, region: region };
        }

        // ---------- 初始化嵌入题库 ----------
        function loadEmbeddedDB() {
            const result = parseCSV(DEFAULT_DB_TEXT);
            loadDatabase(result.data, result.region);
            fileStatus.textContent = `📋 嵌入 (${result.data.length} 条)`;
            // 保存到 localStorage 以便后续使用
            saveToLocalStorage(DEFAULT_DB_TEXT);
        }

        // ---------- 本地存储 ----------
        function saveToLocalStorage(text) {
            try {
                localStorage.setItem('pinyin_game_db', text);
                localStorage.setItem('pinyin_game_has_db', 'true');
                return true;
            } catch(e) {
                return false;
            }
        }

        function loadFromLocalStorage() {
            const hasDb = localStorage.getItem('pinyin_game_has_db');
            if (hasDb === 'true') {
                const text = localStorage.getItem('pinyin_game_db');
                if (text) {
                    const result = parseCSV(text);
                    if (result.data.length > 0) {
                        loadDatabase(result.data, result.region);
                        fileStatus.textContent = `📂 自动导入 (${result.data.length} 条)`;
                        return true;
                    }
                }
            }
            return false;
        }

        function importAndSave(file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const text = ev.target.result;
                const result = parseCSV(text);
                if (result.data.length === 0) {
                    fileStatus.textContent = '⚠️ 解析失败';
                    return;
                }
                saveToLocalStorage(text);
                loadDatabase(result.data, result.region);
                fileStatus.textContent = `📂 ${result.data.length} 条 (已保存)`;
            };
            reader.readAsText(file);
        }

        // ==================== 消息处理 ====================
        function handleClientMessage(conn, msg) {
            if (!isHost) return;

            if (msg.type === 'join') {
                let freeSlot = 2;
                while (battlePlayers[freeSlot]) freeSlot++;
                battlePlayers[freeSlot] = { name: msg.name, muted: false, score: 0 };
                conns[freeSlot] = conn;
                conn._slot = freeSlot;
                
                const sysMsg = `${msg.name} 加入了房间`;
                addBattleChat('sys', sysMsg);
                broadcastChat({ type: 'chat', chatType: 'sys', text: sysMsg }); // 广播给玩家
                
                renderBattlePlayers();
                broadcastState();
            } else if (msg.type === 'chat') {
                const player = battlePlayers[msg.slot];
                if (!player) return;
                
                // 检查禁言
                if (player.muted || globalMuted) {
                    return; // 被禁言则无视其发送的任何消息
                }
                
                processBattleChat(msg.slot, player.name, msg.text);
            }
        }

        function handleHostMessage(msg) {
            if (msg.type === 'state') {
                battleState = msg.state.state;
                battlePlayers = msg.state.players;
                globalMuted = msg.state.globalMuted || false;
                battleQuestions = msg.state.questions || [];
                globalRevealedLetters = new Set(msg.state.revealedLetters || []);
                battleStartTime = msg.state.startTime || 0;
                // ===== 新增：接收出题模式 =====
                if (msg.state.battleMode) {
                    currentBattleMode = msg.state.battleMode;
                }
                
                // 找到自己的 slot
                if (mySlot === 1) {
                    for (let slot in battlePlayers) {
                        if (battlePlayers[slot].name === document.getElementById('battleNameInput').value.trim()) {
                            mySlot = parseInt(slot);
                            break;
                        }
                    }
                }

                renderBattleUI();
                updateChatInputState();
            } else if (msg.type === 'chat') {
                // 如果收到清空指令，清空玩家本地的聊天记录
                if (msg.action === 'clear') {
                    battleChatLog = [];
                    document.getElementById('chatMessages').innerHTML = '';
                } else {
                    addBattleChat(msg.chatType, msg.text);
                }
            } else if (msg.type === 'kick') {
                alert('你已被房主踢出房间');
                cleanupBattle();
                switchScreen('home');
            }
        }

                parsedDict.data.forEach(item => { pinyinDict[item.name.toLowerCase()] = item.pinyin; });

                const inputNames = text.split(/[\n,，\s]+/).filter(n => n.trim() !== '');
                const notFound = [];
                inputNames.forEach(name => {

                    if (pinyinDict[lowerName]) db.push({ name: cleanName, pinyin: pinyinDict[lowerName] });

                if (notFound.length > 0) return alert(`未找到：\n${notFound.join('、')}`);

                document.getElementById('chatInput').placeholder = "裁判可在此发公告...";

        // ==================== 聊天与猜题处理 ====================
        document.getElementById('btnSendChat').addEventListener('click', sendChat);

        function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            if (isHost) {
                processBattleChat(1, battlePlayers[1].name, text);
            } else {
                conns['host'].send({ type: 'chat', slot: mySlot, text: text });
            }
        }

        function processBattleChat(slot, sender, text) {
            if (!isHost) return;

            const letterMatch = text.match(/^开字母[：:]\s*([a-zA-Z])$/i);
            if (letterMatch && battleState === 'playing') {
                if (slot === 1 && currentBattleMode === 'manual') {
                    addBattleChat('sys', `[裁判公告] ${text}`);
                    broadcastChat({ type: 'chat', chatType: 'sys', text: `[裁判公告] ${text}` });
                    return;
                }
                
                const letter = letterMatch[1].toLowerCase();
                globalRevealedLetters.add(letter);
                const sysMsg = `${sender} 开启了字母 ${letter.toUpperCase()}`;
                addBattleChat('sys', sysMsg);
                broadcastChat({ type: 'chat', chatType: 'sys', text: sysMsg });
                broadcastState();
                return;
            }

            if (battleState === 'playing') {
                if (slot === 1 && currentBattleMode === 'manual') {
                    addBattleChat('sys', `[裁判公告] ${text}`);
                    broadcastChat({ type: 'chat', chatType: 'sys', text: `[裁判公告] ${text}` });
                    return;
                }

                const normalizedText = text.replace(/\s+/g, '').toLowerCase();
                let matched = false;

                for (let q of battleQuestions) {
                    if (!q.isCorrect && q.name.replace(/\s+/g, '').toLowerCase() === normalizedText) {
                        q.isCorrect = true;
                        matched = true;
                        
                        // ===== 得分计算核心逻辑 =====
                        // 1. 计算当前耗时（秒）
                        let elapsed = Math.floor((Date.now() - battleStartTime) / 1000);
                        let points = 0;
                        
                        // 2. 根据规则计算基础分
                        if (elapsed <= 180) points = 5;
                        else if (elapsed <= 300) points = 3;
                        else if (elapsed <= 600) points = 2;
                        else if (elapsed <= 900) points = 1;
                        else points = 0; // 超过15分钟不得分

                        // 3. 判断是否是最后一题
                        let isLastQuestion = battleQuestions.every(item => item.isCorrect);
                        if (isLastQuestion) {
                            points += 2;
                        }

                        // 4. 加分
                        if (battlePlayers[slot]) {
                            battlePlayers[slot].score = (battlePlayers[slot].score || 0) + points;
                        }

                        const correctMsg = `🎉 ${sender} 猜中了：${q.name}，得 ${points} 分！`;
                        addBattleChat('correct', correctMsg);
                        broadcastChat({ type: 'chat', chatType: 'correct', text: correctMsg });
                        
                        // 如果是最后一题，结束游戏
                        if (isLastQuestion) {
                            battleState = 'finished';
                            if (battleTimerInterval) clearInterval(battleTimerInterval);
                            const endMsg = `🏆 游戏结束！所有题目已被猜出。`;
                            addBattleChat('sys', endMsg);
                            broadcastChat({ type: 'chat', chatType: 'sys', text: endMsg });
                        }
                    }
                }

                if (matched) {
                    broadcastState();
                    return;
                }
            }

            addBattleChat('msg', `${sender}: ${text}`);
            broadcastChat({ type: 'chat', chatType: 'msg', text: `${sender}: ${text}` });
        }

        function addBattleChat(type, text) {
            battleChatLog.push({ type, text });
            if (battleChatLog.length > 100) battleChatLog.shift();
            
            const box = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `chat-msg ${type}`;
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function broadcastChat(chatData) {
            if (!isHost) return;
            for (let slot in conns) {
                if (conns[slot].open) conns[slot].send(chatData);
            }
        }

        // ==================== UI 渲染 ====================
        function renderBattlePlayers() {
            const list = document.getElementById('battlePlayersList');
            if (!list) return;
            list.innerHTML = '';
            
            const slots = Object.keys(battlePlayers);
            for (let i = 0; i < slots.length; i++) {
                const slot = slots[i];
                const p = battlePlayers[slot];
                if (!p) continue;

                const span = document.createElement('span');
                span.className = 'player-tag';
                
                let nameSpan = document.createElement('span');
                let displayName = p.name ? p.name : '未命名';
                
                // ===== 修复：手动出题模式下，裁判不显示分数 =====
                let scoreText = '';
                if (currentBattleMode === 'random' || parseInt(slot) !== 1) {
                    scoreText = p.score !== undefined ? ` (${p.score}分)` : '';
                }
                // ==========================================
                
                let roleText = (parseInt(slot) === 1) ? ' (裁判)' : '';
                
                nameSpan.textContent = displayName + roleText + scoreText;
                
                if (p.muted) {
                    nameSpan.style.textDecoration = 'line-through';
                    nameSpan.style.color = '#ef4444';
                }
                span.appendChild(nameSpan);

                if (isHost && parseInt(slot) !== 1) {
                    const muteBtn = document.createElement('button');
                    muteBtn.className = 'btn-mute';
                    muteBtn.textContent = p.muted ? '解除' : '禁言';
                    muteBtn.onclick = () => {
                        p.muted = !p.muted;
                        broadcastState();
                    };
                    span.appendChild(muteBtn);

                    const kickBtn = document.createElement('button');
                    kickBtn.className = 'btn-kick';
                    kickBtn.textContent = '踢出';
                    kickBtn.onclick = () => {
                        if (confirm(`确定将 ${displayName} 踢出房间吗？`)) {
                            if (conns[slot]) {
                                conns[slot].send({ type: 'kick' });
                                setTimeout(() => conns[slot].close(), 100);
                            }
                        }
                    };
                    span.appendChild(kickBtn);
                }
                list.appendChild(span);
            }
        }

                // ===== 第二步新增：显示结算面板 =====
        function showBattleResult() {
            const modal = document.getElementById('battleResultModal');
            const list = document.getElementById('battleResultList');
            if (!modal || !list) return;

            let playersArr = [];
            for (let slot in battlePlayers) {
                // ===== 修复：手动出题模式下，直接把裁判过滤掉，不加入排行榜 =====
                if (currentBattleMode === 'manual' && parseInt(slot) === 1) {
                    continue;
                }
                // ==================================================================

                playersArr.push({
                    slot: parseInt(slot),
                    name: battlePlayers[slot].name,
                    score: battlePlayers[slot].score || 0
                });
            }
            // 按分数降序排列
            playersArr.sort((a, b) => b.score - a.score);

            let html = '';
            if (playersArr.length === 0) {
                html = '<div style="text-align:center;color:#999;padding:20px;">暂无玩家得分</div>';
            } else {
                playersArr.forEach((p, index) => {
                    let medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : '👤'));
                    let isMe = (p.slot === mySlot);
                    let bgColor = isMe ? '#e0e7ff' : 'transparent';
                    let textColor = isMe ? '#4f46e5' : '#333';
                    
                    html += `<div style="display: flex; justify-content: space-between; padding: 8px 12px; background: ${bgColor}; border-radius: 6px; margin-bottom: 8px; color: ${textColor}; font-weight: ${isMe ? 'bold' : 'normal'};">
                                <span>${medal} ${p.name} ${isMe ? '(你)' : ''}</span>
                                <span style="color: #4f46e5; font-weight: bold;">${p.score} 分</span>
                             </div>`;
                });
            }
            list.innerHTML = html;

            // 按钮状态调整
            const playAgainBtn = document.getElementById('btnPlayAgain');
            const waitHostText = document.getElementById('waitHostText');
            if (isHost) {
                playAgainBtn.style.display = 'block';
                playAgainBtn.textContent = '🔄 再来一局 (重置)';
                waitHostText.style.display = 'none';
            } else {
                playAgainBtn.style.display = 'none';
                waitHostText.style.display = 'block'; // 玩家端显示等待提示
            }

            modal.style.display = 'flex';
        }

        // 绑定结算弹窗的按钮
        document.getElementById('btnPlayAgain').addEventListener('click', () => {
            if (!isHost) return;
            
            // 关闭弹窗，重置状态为等待
            document.getElementById('battleResultModal').style.display = 'none';
            battleState = 'waiting';
            
            // 清理游戏数据
            battleQuestions = [];
            globalRevealedLetters.clear();
            battleStartTime = 0;
            stopBattleTimer();
            
            // 重置所有玩家分数
            for (let slot in battlePlayers) {
                battlePlayers[slot].score = 0;
            }
            
            // 1. 清空房主本地聊天记录
            battleChatLog = [];
            document.getElementById('chatMessages').innerHTML = '';
            
            // 2. 广播“清空聊天”指令给所有玩家
            broadcastChat({ type: 'chat', action: 'clear' });
            
            // 3. 发送并广播重置提示语
            const resetMsg = '房主已重置游戏，请选择模式并点击“开始游戏”。';
            addBattleChat('sys', resetMsg);
            broadcastChat({ type: 'chat', chatType: 'sys', text: resetMsg });
            
            // 恢复房主输入框提示
            document.getElementById('chatInput').placeholder = "裁判可在此发公告...";
            
            broadcastState();
        });

        document.getElementById('btnLeaveAfterResult').addEventListener('click', () => {
            document.getElementById('battleResultModal').style.display = 'none';
            cleanupBattle();
            switchScreen('home');
        });
        // ===== 第二步新增结束 =====
        
                // ===== 独立的计时器控制逻辑 =====
        function startBattleTimer() {
            const timerDisplay = document.getElementById('battleTimerDisplay');
            if (!timerDisplay) return;
            
            timerDisplay.style.display = 'inline';
            
            // 如果已经有定时器在跑，先清除，防止叠加
            if (battleTimerInterval) clearInterval(battleTimerInterval);
            
            function updateTimerUI() {
                // 如果状态不是游戏中，或者时间无效，就停止
                if (battleState !== 'playing' || battleStartTime <= 0) {
                    stopBattleTimer();
                    return;
                }
                let diff = Math.floor((Date.now() - battleStartTime) / 1000);
                let m = String(Math.floor(diff / 60)).padStart(2, '0');
                let s = String(diff % 60).padStart(2, '0');
                timerDisplay.textContent = `⏱ ${m}:${s}`;
            }
            
            updateTimerUI(); // 立即执行一次，避免第一秒空白
            battleTimerInterval = setInterval(updateTimerUI, 1000);
        }

        function stopBattleTimer() {
            const timerDisplay = document.getElementById('battleTimerDisplay');
            if (timerDisplay) timerDisplay.style.display = 'none';
            if (battleTimerInterval) {
                clearInterval(battleTimerInterval);
                battleTimerInterval = null;
            }
        }

        function renderBattleUI() {
            renderBattlePlayers();
            const qList = document.getElementById('battleQuestionsList');
            qList.innerHTML = '';

            battleQuestions.forEach(q => {
                let html = '';
                const chars = q.pinyin.split('');
                chars.forEach(ch => {
                    if (ch === ' ') {
                        html += '&nbsp;&nbsp;';
                    } else {
                        const isRev = q.isCorrect || globalRevealedLetters.has(ch.toLowerCase());
                        if (isRev) {
                            html += `<span style="color:#10b981; background:#dcfce7; padding:0 2px; border-radius:4px;">${ch}</span>`;
                        } else {
                            html += '*';
                        }
                    }
                });

                const item = document.createElement('div');
                item.className = `bq-item ${q.isCorrect ? 'correct' : ''}`;
                item.innerHTML = `
                    <div>#${q.id + 1}. ${html}</div>
                    <div>${q.isCorrect ? `<span style="color:#10b981; font-size:14px;">✅ ${q.name}</span>` : ''}</div>
                `;
                qList.appendChild(item);
            });

            const box = document.getElementById('chatMessages');
            if (box.childElementCount === 0 && battleChatLog.length > 0) {
                battleChatLog.forEach(c => {
                    const div = document.createElement('div');
                    div.className = `chat-msg ${c.type}`;
                    div.textContent = c.text;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            }

            // ===== 自动控制结算面板的弹出与关闭 =====
            if (battleState === 'finished') {
                showBattleResult();
            } else {
                const modal = document.getElementById('battleResultModal');
                if (modal) modal.style.display = 'none';
            }

            // ===== 统一控制计时器 =====
            if (battleState === 'playing' && battleStartTime > 0) {
                startBattleTimer();
            } else {
                stopBattleTimer();
            }
        }

        // 绑定主界面的“好友对决”按钮
        document.getElementById('btnBattleMode').addEventListener('click', function() {
            switchScreen('battle');
        });
    })();
</script>
